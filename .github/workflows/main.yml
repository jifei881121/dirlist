name: Build and Release

on: 
  release:
    types: [published]
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'
    
    - name: Initialize module (if needed)
      run: |
        if [ ! -f go.mod ]; then
          go mod init github.com/${{ github.repository }}
        fi
        go mod tidy
    
    - name: Build
      run: |
        # 添加跨平台编译支持
        GOOS=linux GOARCH=amd64 go build -o myapp-linux-amd64 ./cmd/main
        GOOS=darwin GOARCH=amd64 go build -o myapp-darwin-amd64 ./cmd/main
        GOOS=windows GOARCH=amd64 go build -o myapp-windows-amd64.exe ./cmd/main
    
    - name: Create Release
      if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ github.ref_name }}
        name: Release ${{ github.ref_name }}
        generate_release_notes: true
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Upload Release Assets
      uses: softprops/action-gh-release@v1
      with:
        files: |
          myapp-linux-amd64
          myapp-darwin-amd64
          myapp-windows-amd64.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
